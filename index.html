function q(){const [t,o,a,w,d]=qs[i],ord=sh(o.map((_,k)=>k));let done=0;
render(title,`<div class="qh"><span>${i+1} / ${qs.length}</span><span id="tm">${mmss(Math.round((Date.now()-t0)/1000))}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><p class="q">${t}</p>${d?`<div class="dg">${d}</div>`:""}<div id="o"></div><div id="fb"></div><div class="two"><button class="btn ghost" id="sk">Skip</button><button class="btn" id="nx" disabled>${i+1<qs.length?'Next':'Finish'}</button></div>`);
tmr=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=mmss(Math.round((Date.now()-t0)/1000))},1000);
const box=document.getElementById('o'),nx=document.getElementById('nx'),step=()=>{i++;i<qs.length?q():fin()};
ord.forEach((k,n)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${L[n]}</b>${o[k]}`;
b.onclick=()=>{if(done)return;done=1;const ok=k===a;if(ok)sc++;rec.push([t,o[k],o[a],ok]);note(qs[i],s,ok);
[...box.children].forEach((x,m)=>{if(ord[m]===a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
document.getElementById('fb').innerHTML=`<div class="ex ${ok?'g':'r'}"><b>${ok?'Correct!':'Incorrect'}</b><p>The correct answer is ${L[ord.indexOf(a)]}: ${o[a]}</p><p>${w}</p></div>`;nx.disabled=false;document.getElementById('sk').disabled=true};box.appendChild(b)});
nx.onclick=step;document.getElementById('sk').onclick=()=>{rec.push([t,'Skipped',o[a],false]);note(qs[i],s,false);step()}}
function fin(){const p=Math.round(sc/qs.length*100),tt=Math.round((Date.now()-t0)/1000);if(n>=3&&!pool&&p>pct(s)){prog[CUR+':'+s]=p;sv()}
track(sc,qs.length);render('Results',`<div class="ring" style="background:conic-gradient(var(--blue) ${p}%,var(--line) 0)"><span>${p}%</span></div><p style="text-align:center">You scored <b>${sc} / ${qs.length}</b></p><div class="stats"><div><b>${mmss(tt)}</b><small>Time</small></div><div><b style="color:var(--ok)">${sc}</b><small>Correct</small></div><div><b style="color:var(--bad)">${qs.length-sc}</b><small>Incorrect</small></div></div><button class="btn ghost" id="rv">Review Answers</button><button class="btn" id="ta">Try Again</button><button class="btn ghost" id="bs">Back to Subject</button>${shareA(sc,qs.length,title)}<div id="rl"></div>`);
document.getElementById('rv').onclick=()=>{document.getElementById('rl').innerHTML=rec.map(r=>`<div class="ex ${r[3]?'g':'r'}"><b>${r[0]}</b><p>Your answer: ${r[1]}</p><p>Correct: ${r[2]}</p></div>`).join('')};
document.getElementById('ta').onclick=()=>{nav.pop();go(()=>quiz(s,n,title,hard,pool))};document.getElementById('bs').onclick=()=>{if(s==='Mistakes'||!GR[CUR][s]){go(myProgress,1);return}nav=nav.slice(0,nav.findIndex(f=>f.toString().includes('modes('))+1);back();go(()=>modes(s))}}
q()}

const TOP={9:{
"Mathematics":[
{t:"Statistics & Probability",k:/\bmean\b|median|\bmode\b|probab|bar graph|pie chart|frequency|grouped data|average|cards numbered/i,n:["<b>Mean</b> = total ÷ number of items. <b>Median</b> = middle value after ordering (for an even count, the average of the two middle values). <b>Mode</b> = the most frequent value.","<b>Grouped data:</b> use class mid-points. Estimated mean = Σfx ÷ Σf. The <b>modal class</b> has the highest frequency; the <b>median class</b> holds the middle position.","<b>Probability</b> = favourable outcomes ÷ total outcomes, always between 0 and 1. Experimental probability = successes ÷ number of trials.","Without replacement the second probability changes: P(both red) from 4 red and 6 blue = 4/10 × 3/9 = 2/15.","<b>Pie chart angle</b> = (frequency ÷ total) × 360°."]},
{t:"Algebra, Equations & Matrices",k:/equation|gradient|y = |inequalit|simultaneous|matri|x \+|solve|line|expression|\bn \+|numbers add/i,n:["<b>Linear equations:</b> do the same to both sides. Form equations from words, e.g. perimeter of a rectangle = 2(l + w).","<b>Simultaneous equations:</b> make one coefficient equal, then add or subtract to eliminate a variable; or substitute.","<b>Inequalities:</b> solve like equations but <b>reverse the sign</b> when multiplying or dividing by a negative number. A solid dot means ≥ or ≤; an open circle means > or <.","<b>Straight lines:</b> gradient m = (y₂ − y₁) ÷ (x₂ − x₁); equation y = mx + c where c is the y-intercept. Parallel lines have equal gradients. For ax + by + c = 0, gradient = −a/b.","<b>Matrices:</b> order = rows × columns. Add or subtract only matrices of the same order. In AB, columns of A must equal rows of B; each element = (row of A) × (column of B)."]},
{t:"Ratios, Percentages & Financial Maths",k:/ratio|proportion|percent|%|profit|discount|vat|interest|commission|duty|depreciat|marked price|rates of work|speed|km\/h|tank|pipe|men |days|exchange|ksh|price/i,n:["<b>Percentage change</b> = (change ÷ original) × 100. Profit % = profit ÷ cost price × 100.","<b>Reverse percentages:</b> if a price after a 20% discount is 640, the original price = 640 ÷ 0.8 = 800.","<b>Simple interest</b> I = PRT ÷ 100. <b>Compound interest:</b> A = P(1 + r/100)ⁿ and interest = A − P.","<b>VAT (16%):</b> price with VAT = price × 1.16; price before VAT = price ÷ 1.16. <b>Customs duty</b> is a percentage of the value of imported goods. <b>Commission</b> is a percentage of sales.","<b>Direct proportion:</b> more gives more. <b>Inverse proportion:</b> more gives less, so men × days stays constant. <b>Rates of work:</b> add the rates (1/6 + 1/3); a drain subtracts.","<b>Speed</b> = distance ÷ time. To change km/h to m/s multiply by 1,000/3,600."]},
{t:"Numbers, Indices & Logarithms",k:/index|indices|logarithm|log|standard form|integer|place value|round|significant|rational|recurring|common divisor|multiple|decimal|fraction|roman|numeral|words/i,n:["<b>Laws of indices:</b> aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ; a^(1/n) is the nth root of a.","<b>Exponential equations:</b> write both sides with the same base, then equate the indices. 2ˣ = 32 → 2ˣ = 2⁵ → x = 5.","<b>Logarithms:</b> logₐN = x means aˣ = N, so log₃81 = 4. Rules: log(MN) = log M + log N; log(M/N) = log M − log N; log Mⁿ = n log M; log₁₀10 = 1.","<b>Rational numbers</b> can be written as a/b. To change 0.666… to a fraction: x = 0.666…, 10x − x = 6, x = 2/3.","<b>GCD</b> (largest common divisor) solves equal-grouping problems; <b>LCM</b> (smallest common multiple) solves 'meet again after…' problems. Use prime factors.","<b>Rounding:</b> look at the next digit — 5 or more rounds up. Significant figures are counted from the first non-zero digit."]},
{t:"Geometry & Trigonometry",k:/triangle|angle|pythag|sin|cos|tan|bearing|polygon|hexagon|parallelogram|circle|sector|arc|similar|enlarg|elevation|scale|map|ladder|coordinates|cube|edges|parallel|tree/i,n:["<b>Pythagoras:</b> in a right-angled triangle a² + b² = c², where c is the hypotenuse.","<b>Trigonometry (SOH CAH TOA):</b> sin θ = opposite ÷ hypotenuse; cos θ = adjacent ÷ hypotenuse; tan θ = opposite ÷ adjacent. Remember sin 30° = ½, cos 60° = ½, tan 45° = 1.","<b>Angle of elevation</b> is measured up from the horizontal, <b>depression</b> down. <b>Bearings</b> are measured clockwise from North using three digits; the back bearing differs by 180°.","<b>Polygons:</b> interior angles add to (n − 2) × 180°; a regular polygon's exterior angle = 360° ÷ n.","<b>Similarity:</b> if the linear scale factor is k, areas scale by k² and volumes by k³.","<b>Map scale:</b> 1 : 50,000 means 1 cm represents 50,000 cm = 0.5 km."]},
{t:"Measurement: Area, Volume & Units",k:/area|perimeter|volume|cylinder|capacity|litre|mass|tonne|surface|frustum|cm²|m²|hectometre|kelvin|temperature|12-hour|error|km\b/i,n:["<b>Area:</b> rectangle l × w; triangle ½bh; circle πr²; sector (θ/360) × πr². <b>Arc length</b> = (θ/360) × 2πr.","<b>Volume:</b> prism = base area × height; cylinder = πr²h; cone = ⅓πr²h; a frustum = large cone − small cone.","<b>Surface area:</b> cube 6a²; closed cylinder 2πr(r + h).","<b>Units:</b> 1 m³ = 1,000 litres; 1 litre = 1,000 cm³; 1 km = 10 Hm = 1,000 m; 1 tonne = 1,000 kg; Kelvin = °C + 273.","<b>Errors:</b> absolute error = |measured − true|; relative error = absolute ÷ true; percentage error = relative × 100."]}],
"Integrated Science":[
{t:"Laboratory, Measurement & Microscopy",k:/microscope|measuring cylinder|apparatus|fire|extinguisher|first aid|safety|\bunit|kilogram|kelvin|litre|calliper|magnification/i,n:["<b>Fire triangle:</b> heat, fuel and oxygen. Remove any one to put out a fire. Use CO₂ extinguishers on electrical fires; never use water on electrical or oil fires.","<b>First aid:</b> wash acid or alkali splashes with plenty of running water; cool burns under running water.","Read a measuring cylinder at eye level at the bottom of the meniscus. SI units: kilogram (mass), second (time), metre (length), kelvin (temperature).","<b>Microscope:</b> eyepiece, objective lens, stage, mirror. Total magnification = eyepiece × objective (10× × 40× = 400×)."]},
{t:"Electricity, Light & Waves",k:/circuit|bulb|current|ammeter|insulator|conductor|wave|frequency|wavelength|sound|echo|\blight\b|battery|amplitude/i,n:["A <b>complete circuit</b> is needed for current. In a <b>series</b> circuit there is one path, so removing a bulb switches the others off. In a <b>parallel</b> circuit each bulb has its own path.","<b>Conductors</b> (copper, iron) let current pass; <b>insulators</b> (plastic, rubber) do not. An ammeter is connected in series.","<b>Waves:</b> speed = frequency × wavelength. The distance between two crests is the wavelength; the maximum displacement is the amplitude.","<b>Sound</b> needs a medium and cannot travel in a vacuum. Echo depth = speed × time ÷ 2.","<b>Light</b> travels in straight lines; shadows form behind opaque objects."]},
{t:"Force, Energy & Motion",k:/force|pressure|newton|energy|weight|speed|friction|gravity|hydroelectric|solar|kinetic|potential|resultant/i,n:["<b>Force</b> is measured in newtons (N). Weight = mass × g (10 N/kg). Friction opposes motion.","<b>Pressure</b> = force ÷ area (pascals). A smaller area gives a greater pressure.","<b>Speed</b> = distance ÷ time. The resultant force is the difference of opposite forces.","<b>Energy</b> is never created or destroyed, only changed: in hydroelectric power it goes potential → kinetic → electrical.","<b>Renewable</b> sources: solar, wind, hydro. <b>Non-renewable:</b> coal, petroleum."]},
{t:"Matter, Acids & Atoms",k:/acid|base|litmus|\bph\b|atom|symbol|rust|mixture|distill|filtr|evapor|magnet|compound|element|neutral|sodium|salt|solution|oxygen|carbon dioxide|proton|burn/i,n:["<b>Elements</b> have one kind of atom; <b>compounds</b> have different atoms chemically joined; <b>mixtures</b> can be separated physically.","<b>Separation:</b> filtration (insoluble solid from liquid), evaporation (dissolved solid), distillation (liquids with different boiling points), magnet (magnetic materials).","<b>Acids</b> turn blue litmus red (pH below 7); <b>bases</b> turn red litmus blue (pH above 7); neutral is pH 7. Acid + base → salt + water (neutralisation).","<b>Atom:</b> protons (+) and neutrons (0) in the nucleus; electrons (−) in shells. Atomic number = protons; mass number = protons + neutrons.","<b>Rusting</b> needs oxygen and water; prevent it by painting, oiling or galvanising."]},
{t:"Living Things: Cells, Nutrition & Health",k:/cell|plant|photosynth|digest|kidney|blood|vaccin|malaria|disease|nutri|protein|vitamin|fibre|starch|bile|gall|osmosis|skin|reproduct|sperm|hormone|villi|iodine|chloroplast|nucleus|leaf|stomach|intestine|fallopian|puberty|adolescen|cholera/i,n:["<b>Plant cells</b> have a cell wall, chloroplasts and a large vacuole; animal cells do not. The nucleus controls the cell; mitochondria release energy.","<b>Photosynthesis:</b> carbon dioxide + water → glucose + oxygen, in chloroplasts using light. Iodine turns blue-black when starch is present.","<b>Nutrients:</b> proteins (growth and repair), carbohydrates (energy), fats (energy store), vitamins and minerals (health), fibre (digestion), water.","<b>Digestion:</b> mouth → oesophagus → stomach (protein digestion starts) → small intestine (absorption; bile emulsifies fats) → large intestine (water absorbed).","<b>Kidneys</b> filter blood to make urine; skin excretes sweat. Prevent disease by vaccination, clean water, mosquito nets and hand washing."]}],
"English":[
{t:"Tenses, Verbs & Voice",k:/tense|passive|reported|\bhave\b|\bhas\b|\bhad\b|\bwent\b|\bwould have\b|conditional|waiting|is being|she said|tom said/i,n:["<b>Tenses:</b> simple present (habits), present continuous (now), simple past (finished), present perfect (has/have + past participle), past perfect (had + past participle).","<b>Passive voice:</b> the object becomes the subject. 'The cook prepared the meal' → 'The meal was prepared by the cook.' Present continuous: 'is being built'.","<b>Reported speech:</b> the tense moves back (am → was, will → would, have been → had been); 'tomorrow' becomes 'the next day'; 'here' becomes 'there'.","<b>Conditionals:</b> first (if + present, will), second (if + past, would), third (if + past perfect, would have).","<b>Agreement:</b> each, every and neither take singular verbs."]},
{t:"Sentence Structure & Grammar",k:/conjunction|although|unless|neither|either|relative|whose|whom|pronoun|article|preposition|plural|comparative|superlative|adverb|combine|\bsince\b|elephant|each of/i,n:["<b>Conjunctions:</b> although/though (contrast), unless (if not), since/because (reason), neither…nor, either…or, not only…but also.","<b>Relative pronouns:</b> who (people), whom (object), whose (possession), which (things), where (places).","<b>Comparison:</b> use -er or 'more' for two things; -est or 'most' for three or more.","<b>Plurals:</b> in compound nouns the main word takes the plural — sisters-in-law.","Use <b>indefinite pronouns</b> (someone, nobody, anyone) and the right <b>article</b> (a, an, the)."]},
{t:"Vocabulary, Idioms & Figures of Speech",k:/idiom|means|figure|simile|metaphor|personif|whisper|generous|synonym|antonym|face the music|count on|look up|put up with/i,n:["<b>Idioms:</b> count on = depend on; look up to = admire; put up with = tolerate; face the music = accept the consequences.","<b>Figures of speech:</b> simile (uses like/as), metaphor (one thing is another), personification (human actions given to things: 'the wind whispered'), hyperbole (exaggeration).","<b>Word formation:</b> generous → generosity; add prefixes (un-, dis-) and suffixes (-ness, -tion).","Choose synonyms and antonyms by context."]},
{t:"Comprehension, Tone & Oral Skills",k:/passage|infer|tone|sarcas|polite|request|greeting|reply|debate|speaker|learners|principal|silent/i,n:["<b>Comprehension:</b> answer from the text first. For inference, use clues in behaviour and word choice — silence and looking at the floor show unease.","<b>Tone:</b> sarcastic (says the opposite of what is meant), humorous, formal, angry.","<b>Polite requests:</b> 'Could I…, please?'; reply to thanks with 'You are welcome'.","In a <b>debate</b> the Speaker keeps order; use respectful language ('not truthful' instead of 'liar')."]},
{t:"Punctuation & Writing",k:/punctuat|exclamation|capital|composition|\?|!/i,n:["Exclamations end with !, questions with ?. Direct speech: \"Where do you live?\" asked Mary.","Combine sentences with conjunctions or relative pronouns.","A good composition has an introduction, body paragraphs and a conclusion; vary sentences and stay on the topic."]}],
"Kiswahili":[
{t:"Ngeli na Nomino",k:/ngeli|wingi|umoja|nomino|kingeli|miti|mti|dhahania|ukubwa|udogo/i,n:["<b>Ngeli</b> hupanga nomino katika makundi: A-WA (mtu – watu), U-I (mti – miti), LI-YA (jicho – macho), KI-VI (kitabu – vitabu), U-ZI (ukuta – kuta), I-ZI (nyumba – nyumba).","Viambishi vya upatanisho hufuata ngeli: Kitabu kizuri kimepotea; Miti ile imeanguka.","<b>Nomino dhahania</b> hazishikiki, mf. upendo, amani, huruma.","Hali ya <b>ukubwa</b> (ji-/ma-): jitu; hali ya <b>udogo</b> (ki-/vi-): kijibwa."]},
{t:"Vitenzi, Nyakati na Kauli",k:/kitenzi|wakati|kauli|ukanusho|kutendwa|kutendeka|kutendea|hatasafiri|atasafiri/i,n:["<b>Nyakati:</b> -li- (uliopita), -na- (uliopo), -ta- (ujao), -me- (timilifu).","<b>Ukanusho:</b> Ninasoma → Sisomi; Atasafiri → Hatasafiri; Wamefaulu → Hawajafaulu.","<b>Kauli:</b> kutenda (soma), kutendwa (somwa), kutendea (somea), kutendeka (someka), kutendana (somana)."]},
{t:"Msamiati, Nahau na Methali",k:/methali|nahau|kinyume|kisawe|maana|shujaa|haba|mbavu|moyo konde/i,n:["<b>Methali:</b> Haba na haba hujaza kibaba (akiba ndogo huleta kingi); Mwenda pole hajikwai (utaratibu huzuia makosa); Mtaka cha mvunguni sharti ainame (anayetaka lazima ajitahidi).","<b>Nahau:</b> kuvunja mbavu = kuchekesha sana; kupiga moyo konde = kujipa ujasiri.","<b>Vinyume:</b> shujaa – mwoga; safi – chafu; ghali – nafuu."]},
{t:"Sarufi: Viunganishi, Taarifa na Uakifishaji",k:/kiunganishi|taarifa|usemi|uakifishaji|alama|ili|lakini|ingawa|nukta/i,n:["<b>Viunganishi:</b> lakini (tofauti), ili (kusudi), ingawa (ukinzani), na, au.","<b>Usemi halisi → taarifa:</b> 'kesho' huwa 'siku iliyofuata'; tumia 'kwamba'.","<b>Uakifishaji:</b> nukta (.), kituo (,), alama ya swali (?), alama ya mshangao (!), alama za kunukuu (\" \")."]},
{t:"Fasihi Simulizi na Mazungumzo",k:/hadithi|fomula|wahusika|adabu|tafadhali|huruma|kuzungumza/i,n:["Hadithi huanza kwa <b>fomula ya ufunguzi</b> (Hapo zamani za kale…) na kuisha kwa <b>fomula ya kufunga</b>.","Hadithi za wanyama hufunza maadili kwa kutumia wanyama kama wahusika.","Katika mazungumzo tumia maneno ya adabu: tafadhali, naomba, pole, asante."]}],
"Social Studies":[
{t:"Map Work, Time & Climate",k:/map|contour|scale|time|climate|vegetation|migration|direction|latitude|longitude|catchment|rain gauge|wind vane|equatorial|heath|mountain|cm|km/i,n:["<b>Scale:</b> 1 cm to 2 km means 6 cm on the map = 12 km on the ground. Contours close together show a steep slope; wide apart a gentle slope.","<b>Time:</b> the Earth turns 15° each hour; places to the east are ahead. Time difference = longitude difference ÷ 15.","<b>Climate:</b> equatorial (hot and wet all year), desert (hot and dry), savannah, Mediterranean. On a high mountain vegetation changes with height: forest, bamboo, then heath and moorland.","<b>Instruments:</b> rain gauge (rainfall), wind vane (wind direction), thermometer (temperature), barometer (pressure).","<b>Rural-to-urban migration</b> is movement from the countryside to town."]},
{t:"History of Africa",k:/egypt|scramble|colonial|berlin|slave|ogiek|fossil|olduvai|ancient|nile|aswan|boundar/i,n:["Africa is the <b>cradle of humankind</b>: early human fossils were found at Olduvai Gorge and Lake Turkana.","<b>Ancient Egypt:</b> farming depended on the Nile's flood and silt. The Aswan High Dam controls floods, stores irrigation water and generates electricity (but traps silt).","<b>Scramble for Africa:</b> the Berlin Conference (1884–85) divided Africa among European powers, creating artificial boundaries.","<b>Chattel slavery:</b> slaves were treated as property.","The Ogiek of Kenya were traditionally hunter-gatherers and beekeepers."]},
{t:"Governance & Citizenship",k:/constitution|county|governor|assembly|\blaw\b|rights|national value|equality|citizen|court|magistrate|election|legislat/i,n:["Kenya's <b>Constitution (2010)</b> is the supreme law. There are 47 counties; the Governor leads the county executive and the county assembly makes county laws.","<b>National values:</b> patriotism, rule of law, equality, inclusiveness, non-discrimination, integrity and sustainable development.","<b>Arms of government:</b> Legislature (makes laws), Executive (carries them out), Judiciary (interprets the law)."]},
{t:"Social Relations & Economics",k:/trade|money|conflict|peace|self-esteem|stereotyp|sacco|mediation|arbitration|bank|business|career|relationship|gender|negotiat/i,n:["<b>Resolving conflict:</b> negotiation (parties talk), mediation (neutral helper, no decision), arbitration (neutral person gives a binding decision), litigation (court).","<b>Self-esteem</b> grows with goals, a positive self-image and achievements. Equal opportunities reduce gender stereotyping.","<b>Money</b> must be durable, portable, divisible and acceptable. SACCOs usually give loans at lower interest than moneylenders."]}],
"Agriculture & Nutrition":[
{t:"Crop Production & Soil",k:/crop|soil|lime|mulch|weed|planting|tilth|graft|spacing|terrac|erosion|pest|rotation|manure|garden|tomato|maize|catchment|seedling/i,n:["<b>Soil conservation:</b> terracing, strip cropping, cover crops and mulching reduce erosion.","<b>Lime</b> raises the pH of acidic soil; manure improves structure; <b>crop rotation</b> maintains fertility and breaks pest cycles.","<b>Tilth:</b> fine for small seeds, coarse for large planting materials; correct spacing prevents overcrowding.","<b>Grafting</b> joins a scion to a rootstock of closely related plants so their cambium layers meet.","<b>Soils:</b> sandy drains fast, clay holds water, loam is best."]},
{t:"Livestock & Poultry",k:/egg|poultry|milk|cow|mastitis|layers|forage|hay|silage|fish|bee|dairy|chicken|hen/i,n:["<b>Eggs:</b> clean nests and frequent collection; grade by size. Layers mash has extra calcium for shells.","<b>Dairy:</b> wash the udder before and after milking to prevent mastitis; keep milk by boiling, cooling and refrigerating.","<b>Forage conservation:</b> hay (dry and bale), silage (ferment in airtight pits), standing forage.","<b>Integrated farming:</b> waste from one enterprise feeds another."]},
{t:"Food, Nutrition & Cooking",k:/protein|vitamin|nutri|fibre|kwashiorkor|scurvy|meal|diet|cook|steam|preserv|bread|mandazi|spinach|calcium|iron|roast|baste|vegetable/i,n:["<b>Nutrients:</b> proteins build, carbohydrates give energy, fats store energy, vitamins and minerals protect, fibre prevents constipation.","<b>Deficiencies:</b> kwashiorkor (protein), scurvy (vitamin C), night blindness (vitamin A), anaemia (iron).","<b>Steaming</b> and cooking briefly in little water keeps nutrients. Basting stops roast food drying.","<b>Preservation:</b> drying, smoking, freezing, boiling; cover leftovers."]},
{t:"Home Science & Value Addition",k:/soap|knit|stitch|launder|towel|disinfect|clean|kitchen|yoghurt|value addition|budget|hygiene|contamination|apron|pin/i,n:["<b>Cross-contamination:</b> use separate boards for raw meat and vegetables.","<b>Soap:</b> fat + alkali; salt separates the soap; animal fat hardens it.","<b>Laundry:</b> sort colours, avoid hot water for coloured items, and disinfect to remove germs.","<b>Value addition</b> (milk → yoghurt) raises the price. Budgeting: 40% of KSh 12,000 = KSh 4,800."]}],
"Pre-Technical Studies":[
{t:"Technical Drawing",k:/drawing|scale|projection|oblique|margin|line\b|outline|hidden|centre|elevation|plan\b|protractor|orthographic|dimension|sheet/i,n:["<b>Line types:</b> outline (thick continuous), hidden detail (thin short dashes), centre line (thin chain), construction line (thin continuous).","<b>Scale:</b> 1 : 20 means 120 cm is drawn as 6 cm. A drawing sheet has a margin, a border and a title block.","<b>Projections:</b> in an oblique drawing the front face is true shape with receding lines at 45°. In first-angle orthographic projection the plan lies below the elevation."]},
{t:"Materials, Tools & Workshop Safety",k:/tool|vice|hacksaw|plane|chisel|wood|metal|aluminium|spanner|ceramic|concrete|safety|fire|flammable|extinguisher|mask|calliper|marking|clamp|first aid|try square|steel|hardwood/i,n:["<b>Hardwoods</b> (mahogany) come from slow-growing broad-leaved trees; softwoods (pine) from cone-bearing trees.","<b>Tools:</b> marking gauge, try square (checks squareness), vice (holds work), hacksaw (metal), tenon saw (wood), vernier calliper (accurate measurement), spanner (nuts).","<b>Materials:</b> aluminium is light and resists rusting; ceramics include clay, tiles and porcelain; concrete is cement, sand, ballast and water.","<b>Safety:</b> wear a dust mask, goggles and gloves; use foam or CO₂ extinguishers for oil and electrical fires; methylated spirit is flammable."]},
{t:"Entrepreneurship & Financial Literacy",k:/business|entrepreneur|profit|capital|assets|budget|bank|market|location|loan|statement|trader|sell|loaves|opportunity/i,n:["<b>Entrepreneurs</b> spot needs, take calculated risks and plan; a business plan guides the owner and helps get loans.","<b>Location:</b> near customers and demand, with good transport and security. Ideas come from community needs, hobbies and skills.","<b>Capital</b> = assets − liabilities. <b>Profit</b> = selling price − cost price, multiplied by the number sold.","Banks help travellers with foreign exchange and traveller's cheques."]},
{t:"ICT & Computing",k:/computer|keyboard|software|spreadsheet|backup|data|embedded|email|programming|input|output|storage|password/i,n:["<b>Input:</b> keyboard, mouse. <b>Output:</b> monitor, printer, speaker. <b>Storage:</b> flash disk (removable) and hard disk (fixed).","<b>Software:</b> system software (operating system) and application software (word processor, spreadsheet, presentation).","<b>Data safety:</b> strong passwords, regular backups, antivirus. Embedded computers sit inside machines such as microwave ovens.","<b>E-waste:</b> reduce, reuse, recycle or donate — never dump."]}],
"Creative Arts & Sports":[
{t:"Music & Dance",k:/music|song|tempo|pitch|melody|minim|scale|dynamic|choir|crescendo|dance|drum|rhythm|folk|beat|instrument|diction|note|shaker/i,n:["<b>Pitch</b> is how high or low a sound is; <b>tempo</b> is speed; <b>dynamics:</b> p (soft), f (loud), crescendo (getting louder).","<b>Note values:</b> semibreve 4 beats, minim 2, crotchet 1, quaver ½. G major has one sharp, F♯.","<b>Good singing:</b> clear diction, vocal blend and projection. A folk song belongs to an occasion.","<b>Dance:</b> coordinated movement in step with the drum."]},
{t:"Visual Arts",k:/colour|paint|sculpt|carv|still life|focal|balance|form\b|poster|artwork|monochrom|space|wax|copyright|lettering/i,n:["<b>Primary:</b> red, yellow, blue. <b>Secondary:</b> orange, green, violet. <b>Tertiary:</b> a primary mixed with a neighbouring secondary. Warm colours: red, orange, yellow; cool: blue and green.","<b>Elements:</b> line, shape, form (3D), colour, texture, space. <b>Principles:</b> balance, rhythm (repetition), emphasis (focal point), contrast.","<b>Monochromatic</b> means shades of one colour. Posters need bold, legible lettering and a short clear message.","Respect copyright — do not copy another artist's work and sell it as your own."]},
{t:"Theatre & Storytelling",k:/story|setting|plot|drama|stage|narrat/i,n:["A story has a <b>setting</b>, characters, a <b>plot</b> (beginning, middle, end) and a theme or moral.","Delivery uses vocal projection, gestures and facial expressions; songs help to engage the audience."]},
{t:"Sports & Physical Education",k:/football|netball|rounders|jump|javelin|race|relay|athlet|warm|fair play|drug|rugby|volleyball|sport|endurance|training|stepping|injur/i,n:["<b>Warm up</b> before sport to reduce the risk of muscle and joint injury.","<b>Athletics:</b> 800 m and 1,500 m are middle-distance; triple jump is hop, step, jump; javelin ends with a follow-through.","<b>Netball:</b> no stepping while holding the ball. <b>Rugby:</b> a punt kick is made by dropping the ball and kicking it before it lands.","<b>Fair play</b> means respecting rules, the referee and opponents; drugs harm health and lead to bans. Endurance is built by long, steady runs."]}],
"Religious Education (CRE)":[
{t:"The Bible, Creation & Old Testament Leaders",k:/genesis|creation|adam|eden|bible|books|noah|covenant|abraham|moses|samuel|king|david|elijah|daniel|nehemiah|joseph|historical/i,n:["The Bible has the Old and New Testaments. Historical books include Joshua, Judges, Ruth and Nehemiah.","<b>Creation:</b> God made human beings and gave them responsibility. Disobedience led to Adam and Eve leaving Eden.","<b>Abraham's covenant:</b> shown by a smoking firepot and flaming torch. <b>Moses</b> learned leadership in Pharaoh's palace. Israel asked for a king to be like other nations; David succeeded Saul.","<b>Nehemiah</b> rebuilt the wall through prayer and determination; <b>Daniel</b> stayed faithful in Babylon; <b>Elijah</b> showed on Mount Carmel that only the Lord is God."]},
{t:"Jesus Christ: Birth, Teaching & Miracles",k:/jesus|parable|miracle|baptis|paralytic|storm|lazarus|supper|talents|samaritan|forgive|bethlehem|isaiah|micah|simeon|temple|sheep|midnight/i,n:["<b>Prophecies:</b> Isaiah called the Messiah the Prince of Peace; Micah named Bethlehem. Simeon and Anna blessed the infant Jesus.","<b>Miracles:</b> the paralytic (power to forgive sins), the calming of the storm (power over nature), Lazarus (power over death).","<b>Parables:</b> the lost sheep (God rejoices over repentance), the friend at midnight (persistence in prayer), the Good Samaritan (love for neighbour), the talents (use gifts responsibly).","<b>Forgiveness:</b> Jesus taught forgiving without limit (seventy times seven)."]},
{t:"Christian Living & Values",k:/value|integrity|bribe|drug|bully|talent|leisure|adolescen|life skill|assertive|fruit|love|honest|peer/i,n:["<b>Fruit of the Spirit:</b> love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control.","<b>Integrity:</b> refuse bribes. <b>Assertiveness:</b> say no firmly to drugs and peer pressure. Avoid cyber bullying.","Nurture talents by regular practice; leisure restores energy; support friends through adolescence.","Like Joseph, forgive people who wrong you."]}]
}};
TOP[6]={
"Mathematics":[
{t:"Data Handling",k:/graph|bar |table|data|pie|tally|chose/i,n:["A <b>bar graph</b> compares quantities. Read the height of each bar against the scale on the side.","To combine groups, add their values: netball 25 + hockey 15 = 40.","Read tables carefully: find the right row and column, then the value."]},
{t:"Geometry, Shapes & Area",k:/angle|edges|faces|vertices|parallel|cube|triangle|shape|perimeter|area|square|rectangle/i,n:["<b>Angles:</b> a right angle is 90°; an acute angle is less than 90°; an obtuse angle is between 90° and 180°.","<b>Parallel lines</b> never meet; they stay the same distance apart.","<b>3-D shapes:</b> a cube has 6 faces, 12 edges and 8 vertices.","<b>Perimeter</b> is the distance around a shape (square: 4 × side). <b>Area</b> is the space inside (rectangle: length × width)."]},
{t:"Time, Money & Measures",k:/minutes|a\.m\.|p\.m\.|12-hour|ksh|profit|balance|change|shared|litre|ml|millilitre|tonne|kg|mm|centimetre|length|capacity|mass|film|bus left|items cost/i,n:["<b>Time:</b> for 24-hour times after 12:00, subtract 12 and write p.m. (15:30 = 3:30 p.m.). End time = start time + how long it lasts.","<b>Money:</b> profit = selling price − buying price; balance = amount paid − total cost; sharing means dividing equally.","<b>Length:</b> 1 cm = 10 mm, 1 m = 100 cm, 1 km = 1,000 m. <b>Capacity:</b> 1 litre = 1,000 ml. <b>Mass:</b> 1 kg = 1,000 g and 1 tonne = 1,000 kg.","To convert from a big unit to a small unit, multiply; from small to big, divide."]},
{t:"Fractions, Decimals & Percentages",k:/fraction|decimal|percent|%|\/|0\.|tenths|hundredths/i,n:["<b>Adding fractions:</b> give them the same denominator first. 2/5 + 1/10 = 4/10 + 1/10 = 1/2.","<b>Fraction of an amount:</b> 3/4 of 120 = (120 ÷ 4) × 3 = 90.","<b>Percent</b> means out of 100. 35% = 35/100 = 7/20.","<b>Fraction to decimal:</b> divide the top by the bottom. 3/20 = 0.15.","<b>Decimals:</b> line up the decimal points when adding or subtracting (0.8 − 0.355 = 0.445). In 6.84 the 8 is in the tenths place."]},
{t:"Whole Numbers & Place Value",k:/./,n:["<b>Place value:</b> places run ones, tens, hundreds, thousands, ten thousands, hundred thousands. In 27,548 the 7 stands for 7,000.","<b>Words:</b> 408,060 is 'four hundred and eight thousand and sixty'.","<b>Ordering:</b> compare digits from the left. Descending order means biggest to smallest.","<b>Rounding:</b> look at the digit to the right of the place you are rounding to; 5 or more rounds up. 4,650 → 4,700 (nearest hundred).","<b>Roman numerals:</b> I = 1, V = 5, X = 10, L = 50, C = 100. XXIV = 20 + 4 = 24.","<b>Multiples and patterns:</b> 24 is a multiple of both 6 and 8. Find a pattern by checking whether numbers are added, multiplied or doubled each time.","<b>Multiplying:</b> break numbers up. 604 × 12 = 6,040 + 1,208 = 7,248. Estimate first by rounding."]}],
"English":[
{t:"Punctuation",k:/punctuat|question mark|quotation/i,n:["A question ends with ?; a statement ends with a full stop.","Spoken words go inside quotation marks: \"Where do you live?\" asked Mary. The question mark stays inside the quotation marks.","Begin sentences and names with capital letters."]},
{t:"Everyday Conversation & Politeness",k:/greeting|polite|borrow|thank|reply|mind|request|good morning/i,n:["<b>Greet politely:</b> 'Good morning, teacher.'","<b>Requests:</b> use 'May I… please?' or 'Could you… please?'","<b>Replies:</b> to 'Thank you', say 'You are welcome'. To 'Do you mind…?', 'No, not at all' means you agree.","Use polite words (please, thank you, excuse me) with elders and teachers."]},
{t:"Vocabulary & Comprehension",k:/delicious|ancient|opposite|infer|means|describes|hardworking|expect|atieno|kamau|word/i,n:["<b>Synonyms</b> mean the same: delicious = tasty. <b>Antonyms</b> are opposites: ancient – modern.","<b>Inference:</b> use clues in the text. Dark clouds and an umbrella suggest rain.","<b>Character:</b> describe people from what they do. Someone who works every day is hardworking.","Read the passage again before you choose an answer."]},
{t:"Prepositions, Conjunctions & Comparison",k:/under|where|unless|would|\bif\b|higher|largest|quickly|adverb|preposition|conjunction|between|elephant/i,n:["<b>Prepositions</b> show position: under, on, in, between.","<b>Where</b> joins a clause that tells about a place. <b>Unless</b> means 'if not'.","<b>Second conditional:</b> If I were a bird, I would fly.","<b>Comparison:</b> use higher for two things and highest for three or more. An <b>adverb</b> describes a verb: he ran quickly.","Use <b>an</b> before a vowel sound: an elephant."]},
{t:"Tenses, Pronouns & Plurals",k:/./,n:["<b>Tenses:</b> past — went (go, went, gone); present perfect — 'She has already eaten'. Use <b>has</b> with he/she/it and <b>have</b> with I/you/we/they.","<b>Pronouns:</b> 'we' is the subject (We enjoyed the trip); 'us' is the object. Someone and nobody are indefinite pronouns.","<b>Plurals:</b> child – children; most nouns add -s or -es."]}],
"Kiswahili":[
{t:"Sarufi: Viunganishi, Uakifishaji na Adabu",k:/kiunganishi|lakini|alama|adabu|huruma|tafadhali|mshangao|naomba/i,n:["<b>Viunganishi:</b> lakini (tofauti), na, au, ili (kusudi).","<b>Alama za uakifishaji:</b> nukta (.), alama ya swali (?), alama ya mshangao (!).","<b>Adabu:</b> tumia maneno kama tafadhali, naomba, pole na asante unapozungumza na wazee na walimu.","<b>Huruma</b> huonyeshwa kwa maneno kama 'Pole sana'."]},
{t:"Msamiati, Methali na Vinyume",k:/kinyume|methali|jirani|siku|safi|chafu|mtaka/i,n:["<b>Vinyume:</b> safi – chafu; mrefu – mfupi; ghali – nafuu.","<b>Methali:</b> Mtaka cha mvunguni sharti ainame (anayetaka kitu lazima ajitahidi).","<b>Jirani</b> ni mtu anayeishi karibu na nyumba yako.","<b>Siku za wiki:</b> Jumatatu, Jumanne, Jumatano, Alhamisi, Ijumaa, Jumamosi, Jumapili."]},
{t:"Vitenzi, Nyakati na Ukanusho",k:/ukanusho|wakati|kitenzi|tulikula|kimbia|ninasoma/i,n:["<b>Nyakati:</b> -li- (uliopita), -na- (uliopo), -ta- (ujao).","<b>Ukanusho:</b> Ninasoma → Sisomi.","<b>Kitenzi</b> ni neno linaloonyesha kitendo, mf. kimbia, soma, cheza."]},
{t:"Ngeli, Wingi na Umoja",k:/./,n:["<b>Ngeli</b> ni makundi ya nomino. KI-VI: kiatu – viatu, kitabu – vitabu. A-WA: mtoto – watoto.","<b>Wingi:</b> mtoto mdogo – watoto wadogo; kitabu kizuri – vitabu vizuri.","<b>Kivumishi</b> hubadilika kulingana na ngeli: viatu vyekundu."]}],
"Science & Technology":[
{t:"Tools & Technology",k:/tool|stored|cleaned|rain gauge|preserv|drying|instrument|measure/i,n:["<b>Care of tools:</b> clean and store them after use so they last longer.","<b>Preserving food:</b> drying removes the water that germs need to grow.","<b>Instruments:</b> a rain gauge measures rainfall, a thermometer measures temperature and a wind vane shows wind direction."]},
{t:"Human Body, Health & Nutrition",k:/nutrient|protein|muscle|hands|germs|soap|body|hygiene/i,n:["<b>Nutrients:</b> proteins build muscles, carbohydrates give energy, vitamins and minerals protect the body, water is needed by every cell.","<b>Hygiene:</b> washing hands with soap removes germs that cause illness.","Eat a <b>balanced diet</b> with foods from all groups."]},
{t:"Living Things, Plants & Animals",k:/plant|roots|animals|herbivore|crop|banana|weed|seed|compost|soil|erosion|terrac|vine|sucker/i,n:["<b>Plant parts:</b> roots take in water; leaves make food; the stem carries water and food.","<b>Animals:</b> herbivores eat plants, carnivores eat meat, omnivores eat both.","<b>Planting materials:</b> seeds, suckers (bananas), cuttings and vines (sweet potatoes).","<b>Weeds:</b> uproot them by hand in a small garden. <b>Compost:</b> made from plant and kitchen waste — never plastic.","<b>Soil erosion</b> can be reduced by terracing and covering the soil with plants."]},
{t:"Matter, Water & Materials",k:/matter|solid|rust|evaporat|vapour|state|liquid|iron/i,n:["<b>States of matter:</b> solids keep their shape; liquids take the shape of the container; gases spread to fill space.","<b>Water cycle:</b> heat makes water evaporate into vapour, which condenses into clouds and falls as rain.","<b>Rusting:</b> iron rusts when it meets oxygen and water. Paint or oil can protect it."]},
{t:"Forces, Heat, Light, Sound & Electricity",k:/./,n:["<b>Force</b> is a push or a pull. It can start motion, stop it or change direction. <b>Friction</b> opposes motion between surfaces.","<b>Heat</b> moves by conduction (through solids, like a metal spoon in hot tea) and by radiation (from the Sun).","<b>Light</b> travels in straight lines. A shadow forms when an opaque object blocks light.","<b>Sound</b> is made when objects vibrate.","A bulb lights only when the <b>circuit is complete</b>: cell, wires, bulb and a closed switch."]}],
"Social Studies":[
{t:"People & Communities of Kenya",k:/language|luo|kalenjin|kikuyu|luhya|akamba|somali|borana|bantu|nilotic|cushitic|trade|farmer|sells/i,n:["Kenya's communities belong to three main language groups: <b>Bantu</b> (Kikuyu, Luhya, Akamba), <b>Nilotes</b> (Luo, Kalenjin, Maasai) and <b>Cushites</b> (Somali, Borana).","<b>Trade</b> is exchanging goods or services for money, for example selling maize to buy shoes.","Every child has rights, such as the right to education."]},
{t:"Geography & Map Work",k:/mountain|park|direction|north|south|migration|wildebeest/i,n:["<b>Directions:</b> the opposite of North-East is South-West; the opposite of North is South.","<b>Mount Kenya</b> is the highest mountain in Kenya.","<b>Maasai Mara</b> is famous for the wildebeest migration."]},
{t:"Government, Courts & Citizens",k:/./,n:["Each county is led by a <b>Governor</b>.","<b>Magistrates</b> and judges hear cases and decide them in court.","Citizens have rights and responsibilities."]}],
"Creative Arts & Sports":[
{t:"Music & Culture",k:/tempo|musical|instrument|song|gourd|folk|music|culture/i,n:["<b>Tempo</b> is the speed of music — fast or slow.","<b>Improvised instruments:</b> a dry gourd with seeds inside makes a shaker; drums are made from skin stretched over wood.","<b>Folk songs</b> help to preserve culture and pass on messages."]},
{t:"Art & Craft",k:/colour|wax|mitre|drawing|paint|mixing|primary|orange/i,n:["<b>Primary colours:</b> red, yellow and blue. Mixing red and yellow gives orange.","<b>Wax resist:</b> draw with wax crayon, then paint over with watery paint; the wax shows through.","<b>Mitre joint:</b> cut the ends of two pieces at 45° to make a right-angled corner, as in a picture frame."]},
{t:"Sports & Games",k:/./,n:["<b>Warm up</b> before sport to prepare your muscles.","<b>Rounders:</b> the batter hits the ball, the bowler throws it, and fielders catch it.","<b>High jump:</b> the athlete jumps over a bar that is raised each round.","Play fairly and work as a team."]}],
"Religious Education (CRE)":[
{t:"Creation & Bible Stories",k:/seventh|noah|adam|david|bible|created|saul|day/i,n:["God created the world in six days and <b>rested on the seventh day</b>.","<b>Adam</b> was the first man.","<b>Noah</b> built the ark because God warned of a flood.","<b>David</b> was chosen by God to replace King Saul."]},
{t:"Jesus' Life & Teaching",k:/jesus|supper|lazarus|fed|loaves|bethany|disciples/i,n:["At the <b>Last Supper</b> Jesus ate with his twelve disciples.","Jesus raised <b>Lazarus</b> from the dead at Bethany.","Jesus fed five thousand people with <b>five loaves and two fish</b>."]},
{t:"Christian Living",k:/./,n:["<b>Fruit of the Holy Spirit:</b> love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control.","Christians normally worship on <b>Sunday</b>.","Support friends going through <b>adolescence</b>: be kind and encouraging."]}]

"Mathematics":{f:["Multiple-choice questions followed by structured questions where you show your working.","Word problems set in everyday situations (shops, farms, travel) are common."],t:[["Geometry & Trigonometry","Pythagoras in word problems, angles, bearings, scale and similar shapes","Geometry & Trigonometry"],["Measurement: Area, Volume & Units","Composite areas, cylinder volume to litres, unit conversion","Measurement: Area, Volume & Units"],["Ratios, Percentages & Financial Maths","Discounts, reverse percentages, profit, speed and money","Ratios, Percentages & Financial Maths"],["Numbers, Indices & Logarithms","Rounding, significant figures, indices, GCD and place value","Numbers, Indices & Logarithms"],["Algebra, Equations & Matrices","Gradient, inequalities, simultaneous equations, matrix order","Algebra, Equations & Matrices"],["Statistics & Probability","Bar graphs, mean and probability","Statistics & Probability"]],k:["Show every step in the structured section and write units.","Estimate first, then check your answer is sensible.","Read word problems twice and underline the numbers."]},

render('Exam Focus - '+s,`<div class="card"><b>Paper format</b>${E.f.map(x=>`<p style="margin:6px 0">${x}</p>`).join('')}</div><h3 class="th">Topics that appeared in the papers</h3>`+E.t.map((x,i)=>`<button class="row" data-i="${i}"><span class="ic" style="background:#fff0c9">🎯</span><div><b>${x[0]}</b><small>${x[1]}${x[2]?' · tap to practise':''}</small></div><i>›</i></button>`).join('')+`<div class="card"><b>Exam tips</b>${E.k.map(x=>`<p style="margin:6px 0">• ${x}</p>`).join('')}</div><p style="font-size:.8rem;color:var(--mute)">Based on the KJSEA papers supplied. The questions in this app are original practice questions, not KNEC papers.</p>`);
app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=E.t[+b.dataset.i];if(!x[2])return;const pool=DATA[s].filter(q=>classify(q,s)===x[2]);if(pool.length)go(()=>quiz(s,Math.min(10,pool.length),'Practice - '+x[0],0,pool))})}

function poolFor(b){const old=CUR;CUR=b.g;let p=(GR[b.g][b.s]||[]).filter(q=>(!b.h||q[5])&&(!b.t.length||b.t.includes(classify(q,b.s))));CUR=old;
const w=(b.k||'').toLowerCase().split(/[\s,]+/).filter(x=>x.length>2);if(w.length)p=p.filter(q=>{const x=(q[0]+' '+q[1].join(' ')+' '+q[3]).toLowerCase();return w.some(y=>x.includes(y))});return p}
function builder(){BS.g=CUR;BS.s='';BS.t=[];BS.h=0;BS.k='';
const gl=Object.keys(GR).map(Number).sort(),opt=(v,t,sel)=>`<option value="${v}"${sel?' selected':''}>${t}</option>`;
render('Quiz builder',`<h1 style="font-size:1.8rem;margin:4px 0 6px">Quiz builder</h1><p style="color:var(--mute);margin:0 0 10px">Build a quiz from the question bank for what you are revising.</p>
<label class="lb">Grade level</label><select id="bg" class="in">${opt('','Select a grade',0)+gl.map(g=>opt(g,'Grade '+g+(g==6?' (KPSEA)':g==9?' (KJSEA)':''),BS.g==g)).join('')}</select>
<label class="lb">Subject</label><select id="bs" class="in"></select>
<label class="lb">Topics <small style="font-weight:400;color:var(--mute)">(optional)</small></label><p class="sm">Leave unticked to cover the whole subject.</p><div id="bt" class="chips"></div>
<label class="lb">Number of questions</label><select id="bn" class="in">${[5,10,15,20,30].map(v=>opt(v,v,BS.n==v)).join('')}</select>
<div id="bh"></div>
<label class="lb">Focus words <small style="font-weight:400;color:var(--mute)">(optional)</small></label><textarea id="bk" class="in" rows="3" placeholder="For example: fractions, soil, parallel circuits"></textarea><p id="bm" style="color:var(--bad);margin:6px 0"></p>
<button class="btn" id="bgn">✨ Generate</button>`);
const g=id=>document.getElementById(id);
const fillS=()=>{const ss=Object.keys(GR[BS.g]||{});g('bs').innerHTML=`<option value="">${BS.g?'Select a subject':'Select a grade first'}</option>`+ss.map(x=>`<option value="${x}">${x}</option>`).join('');g('bs').disabled=!BS.g};
const fillT=()=>{const T=BS.s?topicsOf(BS.s):null;g('bt').innerHTML=T?T.map((t,i)=>`<button class="chip" data-t="${i}">${t.t}</button>`).join(''):'<span class="sm">Select a subject first</span>';
app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const nm=T[+b.dataset.t].t;BS.t=BS.t.includes(nm)?BS.t.filter(x=>x!==nm):BS.t.concat(nm);b.classList.toggle('on')})};
const fillH=()=>{g('bh').innerHTML=BS.g==9?'<label class="lb">Difficulty</label><select id="bd" class="in"><option value="0">All questions</option><option value="1">Challenge questions only</option></select>':'';const d=g('bd');if(d)d.onchange=()=>{BS.h=+d.value}};
fillS();fillT();fillH();
g('bg').onchange=()=>{BS.g=+g('bg').value||0;BS.s='';BS.t=[];if(BS.g)setGrade(BS.g);fillS();fillT();fillH()};
g('bs').onchange=()=>{BS.s=g('bs').value;BS.t=[];fillT()};
g('bn').onchange=()=>{BS.n=+g('bn').value};
g('bgn').onclick=()=>{BS.k=g('bk').value;const m=g('bm');if(!BS.g||!BS.s){m.textContent='Choose a grade and a subject first.';return}
if(!prem){go(paywall);return}
const p=poolFor(BS);if(!p.length){m.textContent='No questions match. Try fewer topics or different words.';return}
go(()=>quiz(BS.s,Math.min(BS.n,p.length),'Custom quiz',0,p))}}
function qbBtn(){const s=document.querySelector('section');if(!s)return;const b=document.createElement('button');b.className='row';b.innerHTML='<span class="ic" style="background:#0f2f2c">✨</span><div><b>Quiz builder</b><small>Choose grade, subject and topics, then generate a quiz</small></div><i>›</i>';b.onclick=()=>go(builder);s.prepend(b)}

B:[
{n:21,q:'A water reservoir is in the shape of a cube. The volume of the reservoir is 5,832 m³.',p:[{l:'a',q:'Write 5,832 in standard form.',m:1,a:'5.832 × 10³'},{l:'b',q:'Use the mathematical tables to determine the length of one side of the reservoir.',m:4,a:'Side = ∛5,832 = ∛(5.832 × 10³) = ∛5.832 × 10. From the tables ∛5.832 = 1.8, so side = 1.8 × 10 = 18 m.'}]},
{n:22,q:'In a certain year 12,309,745 people registered as voters.',p:[{l:'a',q:'Write the number of people who registered as voters in words.',m:2,a:'Twelve million, three hundred and nine thousand, seven hundred and forty-five.'},{l:'b',q:'By how much is the total value of digit 3 more than the total value of digit 9 in the number?',m:3,a:'Digit 3 is in the hundred-thousands place = 300,000. Digit 9 is in the thousands place = 9,000. Difference = 300,000 − 9,000 = 291,000.'}]},
{n:23,q:'At a school event, the ratio of children to women to men was 3 : 5 : 8 respectively. The number of women was 150. Determine:',p:[{l:'a',q:'The number of men who attended the event.',m:2,a:'1 part = 150 ÷ 5 = 30. Men = 8 × 30 = 240.'},{l:'b',q:'How many more men than children attended the event?',m:2,a:'Children = 3 × 30 = 90. 240 − 90 = 150 more men.'}]},
{n:24,q:'Mr Odhiambo gave money to his three children. He gave a quarter of the total amount to the first child and 2/3 of the remainder to the second child. He was left with KSh 3,000, which he gave to the third child. Determine how much money he gave out altogether.',p:[{l:'',q:'',m:4,a:'Let the total be T. First child: T/4, remainder 3T/4. Second child: 2/3 × 3T/4 = T/2. Left: 3T/4 − T/2 = T/4 = 3,000, so T = KSh 12,000.'}]},
{n:25,q:'Wafula had two children, Brian and Cate. When Brian was born, Cate was 3 years old, Wafula was p years old and his wife was 6 years younger than him. Write a simplified expression to show their total age in 8 years.',p:[{l:'',q:'',m:5,a:'At Brian\'s birth: Brian 0, Cate 3, Wafula p, wife p − 6. After 8 years: Brian 8, Cate 11, Wafula p + 8, wife p + 2. Total = 8 + 11 + (p + 8) + (p + 2) = 2p + 29.'}]},
{n:26,q:'Achieng plotted line AB on a grid. The coordinates of points A and B are A(3, 5) and B(7, 1). Determine the:',p:[{l:'a',q:'equation of line AB in the form y = mx + c.',m:3,a:'Gradient m = (1 − 5) ÷ (7 − 3) = −1. Using A(3, 5): 5 = −3 + c, so c = 8. Equation: y = −x + 8.'},{l:'b',q:'coordinates at the x and y intercepts.',m:3,a:'y-intercept: x = 0 gives y = 8, so (0, 8). x-intercept: y = 0 gives x = 8, so (8, 0).'}]},
{n:27,q:'Oduor constructed a cylindrical concrete pillar of diameter 56 cm and height 2 metres.',p:[{l:'a',q:'Determine the volume of the pillar in cm³. (π = 22/7)',m:2,a:'r = 28 cm, h = 200 cm. V = 22/7 × 28 × 28 × 200 = 492,800 cm³.'},{l:'b',q:'If the pillar had a mass of 985.6 kg, determine the density in kg/m³.',m:2,a:'492,800 cm³ = 0.4928 m³. Density = 985.6 ÷ 0.4928 = 2,000 kg/m³.'}]},
{n:28,q:'',p:[{l:'a',q:'A Kenyan firm received US dollar 2,500 for goods sold to a foreign country. The money was converted to Kenya shillings in a bank which buys at KSh 127.50 and sells at KSh 132.50 per dollar. Calculate the amount in Kenya shillings the firm received.',m:2,a:'The bank buys the dollars at 127.50: 2,500 × 127.50 = KSh 318,750.'},{l:'b',q:'Faith is paid a basic salary of KSh 60,000 as a sales agent. In addition she is paid 4% commission for goods sold above KSh 200,000. In one month she earned a total of KSh 92,000. Determine the total value of sales.',m:4,a:'Commission = 92,000 − 60,000 = 32,000. 4% of (sales − 200,000) = 32,000, so sales − 200,000 = 32,000 × 100 ÷ 4 = 800,000. Sales = KSh 1,000,000.'}]},
{n:29,q:'Wekesa borrowed KSh 400,000 from a bank that charges a simple interest rate of 5% per month. How much altogether did Wekesa pay back after one year?',p:[{l:'',q:'',m:3,a:'Interest = 400,000 × 5 × 12 ÷ 100 = KSh 240,000. Total = 400,000 + 240,000 = KSh 640,000.'}]},
{n:30,q:'Mary made a model in the shape of a square-based pyramid. The base has sides of 6 cm and the vertical height of the pyramid is 4 cm. Determine the total surface area of the pyramid.',p:[{l:'',q:'',m:3,a:'Slant height = √(4² + 3²) = 5 cm. Each triangular face = ½ × 6 × 5 = 15 cm², so four faces = 60 cm². Base = 36 cm². Total = 96 cm².'}]},
{n:31,q:'Kiprop was driving a car at a speed of 108 km/h on a highway. He applied brakes and in 5 seconds the speed of the car reduced to 36 km/h. Calculate the deceleration of the car.',p:[{l:'',q:'',m:3,a:'108 km/h = 30 m/s and 36 km/h = 10 m/s. Acceleration = (10 − 30) ÷ 5 = −4 m/s². The deceleration is 4 m/s².'}]},
{n:32,q:'Waweru left home and cycled for 2 hours at an average speed of 9 km/h. He rested for 1 hour and continued the journey for 3 hours at an average speed of 8 km/h. Determine his average speed for the whole journey.',p:[{l:'',q:'',m:4,a:'Distance 1 = 2 × 9 = 18 km. Distance 2 = 3 × 8 = 24 km. Total distance = 42 km. Total time = 2 + 1 + 3 = 6 h. Average speed = 42 ÷ 6 = 7 km/h.'}]},
{n:33,q:'Mazrui bought a spherical orange of diameter 8.4 cm. He cut the orange into two equal parts along the diameter. Determine the volume of each part. (π = 22/7)',p:[{l:'',q:'',m:3,a:'r = 4.2 cm. Volume of a hemisphere = ⅔πr³ = ⅔ × 22/7 × 4.2³ = ⅔ × 22/7 × 74.088 = 155.232 cm³ (about 155.2 cm³).'}]},
{n:34,q:'A carpenter designed a stool with a triangular top. A model of the top was triangle ABC such that AB = 6 cm, BC = 5 cm and angle ABC = 60°.',p:[{l:'a',q:'Construct triangle ABC.',m:3,a:'Draw AB = 6 cm. At B construct 60° (using compasses and a ruler). Measure 5 cm along the 60° line to mark C. Join A to C. Award marks for AB, the 60° angle and BC.'},{l:'b',q:'Measure line AC.',m:1,a:'AC ≈ 5.6 cm (accept 5.5 to 5.7 cm).'},{l:'c',q:'Measure angle BAC.',m:1,a:'Angle BAC ≈ 51° (accept 50° to 52°).'}]},

{n:36,q:'The equations of two lines are given by 2y = x − 2 and y = 4 − 2x.',p:[{l:'a',q:'Without drawing, determine whether the lines are perpendicular.',m:3,a:'2y = x − 2 gives y = ½x − 1, so m₁ = ½. y = 4 − 2x gives m₂ = −2. m₁ × m₂ = ½ × (−2) = −1, so the lines are perpendicular.'},{l:'b',q:'Determine the coordinates of the point of intersection of the two lines.',m:2,a:'2(4 − 2x) = x − 2 gives 8 − 4x = x − 2, so 10 = 5x and x = 2. Then y = 4 − 4 = 0. The point is (2, 0).'}]},
