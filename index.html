<title>Rhema CBC Revision</title>
<style>
:root{--nav:#0a0a0a;--blue:#1a56d6;--bg:#eef3fb;--card:#fff;--ink:#14213d;--mute:#65748f;--line:#d5dfef;--ok:#1b8a4b;--okbg:#e2f5e9;--bad:#c62828;--badbg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1428;--card:#14213d;--ink:#e8eefb;--mute:#9fb0cf;--line:#26385f;--okbg:#14382a;--badbg:#3d1d1d}}
:root[data-theme="dark"]{--bg:#0b1428;--card:#14213d;--ink:#e8eefb;--mute:#9fb0cf;--line:#26385f;--okbg:#14382a;--badbg:#3d1d1d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;position:sticky;top:0;z-index:2}
header h2{margin:0;font-size:1.1rem;flex:1;text-align:center}
.bk{background:none;border:0;color:#fff;font-size:1.8rem;line-height:1;width:32px;cursor:pointer}
section{flex:1;padding:16px 14px 90px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mute);font:inherit;font-size:.75rem;cursor:pointer}
nav button span{display:block;font-size:1.3rem}nav button.on{color:var(--blue);font-weight:bold}
button{font:inherit}
.splash{text-align:center;padding-top:14vh}
.logo{font-size:3.4rem}.splash h1{margin:4px 0;color:var(--nav);font-size:1.9rem;letter-spacing:1px}
@media (prefers-color-scheme:dark){.splash h1{color:#cfe0ff}}
.splash p{color:var(--mute);margin:10px 24px 40px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:24px;padding:13px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--blue)}.btn:disabled{opacity:.4}
.gr{display:flex;align-items:center;width:100%;border:0;border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;text-align:left;cursor:pointer}
.gr b{font-size:1.1rem;display:block}.gr small{opacity:.9}.gr span:first-child{font-size:1.7rem;margin-right:14px}.gr i{margin-left:auto;font-style:normal;font-size:1.5rem}
.gr.off{opacity:.55}
.seg{display:flex;border-bottom:2px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:10px;color:var(--mute);cursor:pointer}.seg .on{color:var(--blue);font-weight:bold;border-bottom:3px solid var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;color:var(--ink);cursor:pointer}
.tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 8px}
.tile small{display:block;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;color:var(--ink);text-align:left;cursor:pointer}
.row .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.row div{flex:1}.row small{display:block;color:var(--mute)}.row i{font-style:normal;color:var(--mute);font-size:1.3rem}
.hero{background:#dbe8ff;color:#0a0a0a;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.hero .ic{font-size:2rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--blue)}
.qh{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px}
.q{font-size:1.1rem;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;color:var(--ink);text-align:left;cursor:pointer}
.opt b{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.ex{border-radius:12px;padding:10px 14px;margin:10px 0}.ex.g{background:var(--okbg)}.ex.r{background:var(--badbg)}.ex p{margin:4px 0}
.two{display:flex;gap:10px}
.ring{width:130px;height:130px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center}
.ring span{width:98px;height:98px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:bold}
.stats{display:flex;gap:8px;margin:14px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.flip{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;cursor:pointer;padding:20px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dg{background:#fff;border-radius:10px;padding:6px;margin:8px 0;text-align:center}.dg svg{max-width:100%;height:auto}.in{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:8px 0}summary{cursor:pointer;font-weight:bold}
:root{--blue:#1f4fd8;--gold:#f5b800;--bg:#f3f5fb}
header{background:linear-gradient(135deg,#0b1f4d,#1a3a8f);border-bottom:3px solid var(--gold)}
header h2{letter-spacing:.3px}
.btn{border-radius:14px;padding:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.ghost{box-shadow:none}
.tile{border:0;border-radius:20px;box-shadow:0 3px 12px rgba(11,31,77,.14);padding:20px 8px;font-weight:bold}
.tile .ic{width:60px;height:60px;border-radius:50%;font-size:1.9rem}
.row,.card,.opt{border-radius:16px;box-shadow:0 1px 6px rgba(11,31,77,.08)}
.gr{border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.bar{height:10px;border-radius:5px}.bar i{background:linear-gradient(90deg,var(--blue),var(--gold))}
nav{border-top:3px solid var(--gold)}nav button.on{color:#0b1f4d;font-weight:bold}
#app:has(.splash){background:linear-gradient(160deg,#0b1f4d,#1d44a6);color:#fff}
.splash h1{color:#fff;font-size:2.4rem;letter-spacing:4px}.splash b{color:var(--gold);letter-spacing:3px}.splash p{color:#cfe0ff}
.splash .btn{background:var(--gold);color:#0b1f4d;font-size:1.05rem}
.logo{width:100px;height:100px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:3.2rem;box-shadow:0 0 0 8px rgba(245,184,0,.25)}

:root{--nav:#0a0a0a;--blue:#2563eb;--bg:#f4f6fa;--ink:#0a0a0a;--line:#e1e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#161616;--ink:#fff;--mute:#a3a3a3;--line:#2a2a2a}}
header{background:#0a0a0a;border-bottom:3px solid var(--blue)}
nav{border-top:3px solid var(--blue)}nav button.on{color:var(--blue)}
.bar i{background:var(--blue)}
.tile .ic,.row .ic{background:#e8f0ff!important}
.gr{background:#2563eb!important}.gr:nth-child(odd){background:#0a0a0a!important}
.hero{background:#e8f0ff;color:#0a0a0a}
#app:has(.splash){background:radial-gradient(circle at 50% 30%,#12306e,#0a0a0a 65%);color:#fff}
.splash b{color:#60a5fa}.splash p{color:#d4d4d8}
.splash .btn{background:#2563eb;color:#fff}
.logo{background:#2563eb;color:#fff;box-shadow:0 0 0 8px rgba(37,99,235,.3)}
