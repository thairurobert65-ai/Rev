*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.4}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;position:sticky;top:0;z-index:2}
header h2{margin:0;font-size:1.1rem;flex:1;text-align:center}
.bk{background:none;border:0;color:#fff;font-size:1.8rem;line-height:1;width:32px;cursor:pointer}
section{flex:1;padding:16px 14px 90px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mute);font:inherit;font-size:.75rem;cursor:pointer}
nav button span{display:block;font-size:1.3rem}nav button.on{color:var(--blue);font-weight:bold}
button{font:inherit}
.splash{text-align:center;padding-top:14vh}
.logo{font-size:3.4rem}.splash h1{margin:4px 0;color:var(--nav);font-size:1.9rem;letter-spacing:1px}
@media (prefers-color-scheme:dark){.splash h1{color:#cfe0ff}}
.splash p{color:var(--mute);margin:10px 24px 40px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:24px;padding:13px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--blue)}.btn:disabled{opacity:.4}
.gr{display:flex;align-items:center;width:100%;border:0;border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;text-align:left;cursor:pointer}
.gr b{font-size:1.1rem;display:block}.gr small{opacity:.9}.gr span:first-child{font-size:1.7rem;margin-right:14px}.gr i{margin-left:auto;font-style:normal;font-size:1.5rem}
.gr.off{opacity:.55}
.seg{display:flex;border-bottom:2px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:10px;color:var(--mute);cursor:pointer}.seg .on{color:var(--blue);font-weight:bold;border-bottom:3px solid var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;color:var(--ink);cursor:pointer}
.tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 8px}
.tile small{display:block;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;color:var(--ink);text-align:left;cursor:pointer}
.row .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.row div{flex:1}.row small{display:block;color:var(--mute)}.row i{font-style:normal;color:var(--mute);font-size:1.3rem}
.hero{background:#dbe8ff;color:#0a0a0a;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.hero .ic{font-size:2rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--blue)}
.qh{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px}
.q{font-size:1.1rem;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;color:var(--ink);text-align:left;cursor:pointer}
.opt b{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.ex{border-radius:12px;padding:10px 14px;margin:10px 0}.ex.g{background:var(--okbg)}.ex.r{background:var(--badbg)}.ex p{margin:4px 0}
.two{display:flex;gap:10px}

.ring span{width:98px;height:98px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:bold}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.flip{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;cursor:pointer;padding:20px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dg{background:#fff;border-radius:10px;padding:6px;margin:8px 0;text-align:center}.dg svg{max-width:100%;height:auto}.in{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:8px 0}summary{cursor:pointer;font-weight:bold}
:root{--blue:#1f4fd8;--gold:#f5b800;--bg:#f3f5fb}

.row,.card,.opt{border-radius:16px;box-shadow:0 1px 6px rgba(11,31,77,.08)}
.gr{border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.bar{height:10px;border-radius:5px}.bar i{background:linear-gradient(90deg,var(--blue),var(--gold))}
nav{border-top:3px solid var(--gold)}nav button.on{color:#0b1f4d;font-weight:bold}

function render(title,body,tab,nb){clearInterval(tmr);
app.innerHTML=`<header>${nb?'':'<button class="bk" id="bk" aria-label="Back">‹</button>'}<h2>${title}</h2>${nb?'':'<span style="width:32px"></span>'}</header><section>${body}</section>`+(tab?`<nav>${[['Home','🏠'],['Subjects','📚'],['Progress','📊']].map(([n,i])=>`<button data-t="${n}" class="${tab===n?'on':''}"><span>${i}</span>${n}</button>`).join('')}</nav>`:'');

function splash(){app.innerHTML=`<section class="splash"><div class="logo">📖</div><h1>RHEMA</h1><b>CBC REVISION</b><p>Preparing learners for KPSEA &amp; KJSEA</p><button class="btn" id="gs">Get Started</button></section>`;document.getElementById('gs').onclick=()=>go(grades,1)}
function grades(){const G=[[4,'CBC','#2e9e5b','🧒'],[5,'CBC','#f28c1e','👦'],[6,'KPSEA','#1f6fd1','🎓'],[7,'CBC','#7b3fc4','🧑‍🎓'],[8,'CBC','#12a3a3','📚'],[9,'KJSEA','#e8474c','🏫']];
render('Select Grade',G.map(([n,t,c,e])=>`<button class="gr ${n==9?'':'off'}" style="background:${c}" data-g="${n}"><span>${e}</span><div><b>Grade ${n}</b><small>${t}${n==9?'':' · coming soon'}</small></div><i>›</i></button>`).join(''),'Home',1);

function subjects(t){render('Grade 9 - KJSEA',`<div class="seg"><button class="${t=='s'?'on':''}" data-x="s">Subjects</button><button class="${t=='p'?'on':''}" data-x="p">My Progress</button></div>`+(t=='s'?`<div class="grid">${SUBS.map(s=>`<button class="tile" data-s="${s}"><div class="ic" style="background:${IC[s][1]}">${IC[s][0]}</div>${s}</button>`).join('')}</div>`:SUBS.map(s=>`<div class="card"><b>${s}</b><div class="bar"><i style="width:${pct(s)}%"></i></div><small>Best score: ${pct(s)}%</small></div>`).join('')),t=='s'?'Subjects':'Progress');

function modes(s){const M=[['Learn','Notes & worked examples','📘','#dbe8ff',()=>learn(s)],['Practice','Topic-based questions','✏️','#ffe3c4',()=>quiz(s,Math.min(15,DATA[s].length),'Practice - '+s)],['Mock Exams','Full exam simulations','📝','#e4e4f7',()=>mock()],['Quick Revision','Short questions','⚡','#d8f3e2',()=>quiz(s,3,'Quick Revision')],['Flashcards','Key concepts','🗂️','#ffd9ec',()=>cards(s)]];

app.querySelectorAll('.row').forEach(b=>b.onclick=()=>go(M[b.dataset.m][4]))}
function learn(s){render('Learn - '+s,DATA[s].map(([q,o,a,w,d])=>`<div class="card"><b>${q}</b>${d?`<div class="dg">${d}</div>`:""}<p>Answer: <b>${o[a]}</b></p><small>${w}</small></div>`).join(''))}
function cards(s){let d=sh(DATA[s].filter(x=>!x[4])),i=0,f=0;(function r(){const [q,o,a,w]=d[i];render('Flashcards',`<div class="qh"><span>${i+1} / ${d.length}</span></div><button class="card flip" id="fc" style="width:100%;color:var(--ink)">${f?`<div><b>${o[a]}</b><p><small>${w}</small></p></div>`:q}</button><div class="two"><button class="btn ghost" id="pv">Previous</button><button class="btn" id="nx">Next</button></div>`);
document.getElementById('fc').onclick=()=>{f=!f;r()};document.getElementById('nx').onclick=()=>{i=(i+1)%d.length;f=0;r()};document.getElementById('pv').onclick=()=>{i=(i-1+d.length)%d.length;f=0;r()}})()}
function mock(){render('Mock Exams',SUBS.map(s=>`<div class="row" style="cursor:default"><span class="ic" style="background:${IC[s][1]}">${IC[s][0]}</span><div><b>${s}</b><small>${DATA[s].length} questions</small></div><button class="btn" style="width:auto;margin:0;padding:8px 18px" data-s="${s}">Start</button></div>`).join(''),'Subjects');
app.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>go(()=>quiz(b.dataset.s,DATA[b.dataset.s].length,'Mock - '+b.dataset.s)))}
function quiz(s,n,title){const qs=sh(DATA[s]).slice(0,n);let i=0,sc=0,rec=[];const t0=Date.now();
function q(){const [t,o,a,w,d]=qs[i],ord=sh(o.map((_,k)=>k));let done=0;
render(title,`<div class="qh"><span>${i+1} / ${qs.length}</span><span id="tm">${mmss(Math.round((Date.now()-t0)/1000))}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><p class="q">${t}</p>${d?`<div class="dg">${d}</div>`:""}<div id="o"></div><div id="fb"></div><div class="two"><button class="btn ghost" id="sk">Skip</button><button class="btn" id="nx" disabled>${i+1<qs.length?'Next':'Finish'}</button></div>`);
tmr=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=mmss(Math.round((Date.now()-t0)/1000))},1000);
const box=document.getElementById('o'),nx=document.getElementById('nx'),step=()=>{i++;i<qs.length?q():fin()};
ord.forEach((k,n)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${L[n]}</b>${o[k]}`;
b.onclick=()=>{if(done)return;done=1;const ok=k===a;if(ok)sc++;rec.push([t,o[k],o[a],ok]);
[...box.children].forEach((x,m)=>{if(ord[m]===a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
document.getElementById('fb').innerHTML=`<div class="ex ${ok?'g':'r'}"><b>${ok?'Correct!':'Incorrect'}</b><p>The correct answer is ${L[ord.indexOf(a)]}: ${o[a]}</p><p>${w}</p></div>`;nx.disabled=false;document.getElementById('sk').disabled=true};box.appendChild(b)});
nx.onclick=step;document.getElementById('sk').onclick=()=>{rec.push([t,'Skipped',o[a],false]);step()}}
function fin(){const p=Math.round(sc/qs.length*100),tt=Math.round((Date.now()-t0)/1000);if(n>=3&&p>pct(s)){prog[s]=p;sv()}
render('Results',`<div class="ring" style="background:conic-gradient(var(--blue) ${p}%,var(--line) 0)"><span>${p}%</span></div><p style="text-align:center">You scored <b>${sc} / ${qs.length}</b></p><div class="stats"><div><b>${mmss(tt)}</b><small>Time</small></div><div><b style="color:var(--ok)">${sc}</b><small>Correct</small></div><div><b style="color:var(--bad)">${qs.length-sc}</b><small>Incorrect</small></div></div><button class="btn ghost" id="rv">Review Answers</button><button class="btn" id="ta">Try Again</button><button class="btn ghost" id="bs">Back to Subject</button><div id="rl"></div>`);
document.getElementById('rv').onclick=()=>{document.getElementById('rl').innerHTML=rec.map(r=>`<div class="ex ${r[3]?'g':'r'}"><b>${r[0]}</b><p>Your answer: ${r[1]}</p><p>Correct: ${r[2]}</p></div>`).join('')};
document.getElementById('ta').onclick=()=>{nav.pop();go(()=>quiz(s,n,title))};document.getElementById('bs').onclick=()=>{nav=nav.slice(0,nav.findIndex(f=>f.toString().includes('modes('))+1);back();go(()=>modes(s))}}
q()}

app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p=b.dataset.p;L();if(window.__u)window.__u()});L();
const W=document.getElementById('wa'),R=document.getElementById('rcp'),T=document.getElementById('mt');
const upd=()=>{T.value=`Hello, I paid KSh ${CFG.plans[p].amt} for Rhema CBC Revision (${CFG.plans[p].n}). M-Pesa receipt: ${R.value.trim().toUpperCase()}. My ID: ${did}`;W.href='https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(T.value)};
window.__u=upd;R.oninput=upd;upd();W.onclick=e=>{if(R.value.trim().length<8){e.preventDefault();ps('Type your M-Pesa receipt code first.')}};
document.getElementById('ac').onclick=()=>{const c=document.getElementById('cd').value.toUpperCase().replace(/[^A-Z0-9]/g,''),k=c[0];
if(!CFG.plans[k]||codeFor(k,did)!==c)return ps('That code is not valid for this phone. Check it and your ID.');
const l=lic();if(l&&l.code===c){return left(l)>0?ps('This code is already active.'):ps('This code has expired.')}
ls('g9lic',JSON.stringify({p:k,code:c,start:Date.now()}));lockData();
const d=new Date(Date.now()+CFG.plans[k].days*864e5).toDateString();
render('Premium unlocked',`<div class="card"><b>Thank you!</b><p>Premium is active until <b>${d}</b>.</p></div><button class="btn" id="go">Start revising</button>`);document.getElementById('go').onclick=()=>go(grades,1)}}
const _L=learn,_C=cards,_M=mock,_G=grades,_S=subjects;
learn=s=>prem?_L(s):go(paywall);cards=s=>prem?_C(s):go(paywall);mock=()=>prem?_M():go(paywall);
const banner=()=>{const s=document.querySelector('section');if(s&&!prem){const b=document.createElement('button');b.className='btn';b.textContent='👑 Go Premium';b.onclick=()=>go(paywall);s.prepend(b)}};
grades=()=>{_G();banner()};subjects=t=>{_S(t);banner()};
lockData();splash();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
